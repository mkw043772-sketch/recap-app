<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RECAP MM v17</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#090d16;color:#f8fafc;font-family:sans-serif}
.card{background:#111827;border:1px solid #374151;border-radius:16px;padding:16px;margin-bottom:14px}
.btn-main{background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;font-weight:bold;padding:12px;border-radius:12px;width:100%}
.btn-gen{background:linear-gradient(90deg,#4f46e5,#9333ea);color:#fff;font-weight:bold;padding:14px;border-radius:12px;width:100%}
.active-r{background:#4f46e5!important;color:#fff!important}
</style>
</head>
<body class="p-3 max-w-xl mx-auto">

<div class="card flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <h1 class="font-bold text-lg">🎬 RECAP MM <span class="text-xs bg-emerald-600 px-2 py-0.5 rounded">v17 FIX</span></h1>
    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-xs bg-amber-500/20 text-amber-300 px-3 py-1.5 rounded-lg border border-amber-500/40">🔗 Key ယူရန်</a>
  </div>
  <input type="password" id="geminiKey" placeholder="🔑 Gemini API Key ဒီမှာထည့်ပါ" class="w-full bg-slate-900 border border-amber-500/60 rounded-xl px-3 py-2 text-xs">
</div>

<div class="card">
  <div class="flex justify-between mb-2">
    <span class="text-xs font-bold text-indigo-400">၁။ ဗီဒီယိုဖိုင် တင်ရန်</span>
    <span id="durationTag" class="text-xs text-slate-400">00:00</span>
  </div>
  <input type="file" id="videoUpload" accept="video/*" class="w-full text-xs text-slate-300 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white">
  <p id="uploadLabel" class="text-xs text-emerald-400 mt-2"></p>
</div>

<div class="card">
  <div class="flex justify-between mb-2">
    <span class="text-xs font-bold text-amber-400">၂။ AI ဇာတ်လမ်းနှင့် အသံ</span>
    <button type="button" id="previewVoiceBtn" class="text-xs bg-indigo-600 px-2.5 py-1 rounded-lg font-bold">🔊 အသံစမ်းရန်</button>
  </div>
  <button type="button" id="aiAnalyzeBtn" class="btn-main text-xs mb-3">🧠 AI ဖြင့် ဗီဒီယိုစစ်ဆေးပြီး ဇာတ်လမ်းထုတ်မည်</button>
  <div id="statusLog" class="hidden text-xs p-2 rounded bg-slate-950 text-amber-300 mb-2 break-words"></div>
  <textarea id="recapScript" rows="5" placeholder="[00:00] စာသား..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs"></textarea>
</div>

<div class="card">
  <span class="text-xs font-bold text-indigo-400 block mb-2">၃။ အချိုးအစား နှင့် အသံ</span>
  <div class="grid grid-cols-4 gap-2 mb-3">
    <button type="button" data-ratio="9:16" class="ratio-btn active-r bg-slate-800 py-1.5 rounded-lg text-xs font-bold">9:16</button>
    <button type="button" data-ratio="16:9" class="ratio-btn bg-slate-800 py-1.5 rounded-lg text-xs font-bold">16:9</button>
    <button type="button" data-ratio="1:1" class="ratio-btn bg-slate-800 py-1.5 rounded-lg text-xs font-bold">1:1</button>
    <button type="button" data-ratio="4:5" class="ratio-btn bg-slate-800 py-1.5 rounded-lg text-xs font-bold">4:5</button>
  </div>
  <div class="grid grid-cols-2 gap-2 text-xs">
    <label class="bg-slate-900 p-2 rounded-lg flex items-center gap-2">
      <input type="radio" name="aiVoice" value="FEMALE" checked> 👩 မိန်းကလေးအသံ
    </label>
    <label class="bg-slate-900 p-2 rounded-lg flex items-center gap-2">
      <input type="radio" name="aiVoice" value="MALE"> 👦 ယောက်ျားလေးအသံ
    </label>
  </div>
</div>

<div class="card flex flex-col items-center">
  <video id="hiddenVideo" class="hidden" playsinline muted></video>
  <canvas id="studioCanvas" width="540" height="960" class="max-h-80 w-auto bg-black rounded-xl border border-slate-800 mb-3"></canvas>
  <div id="renderProgressBox" class="w-full bg-slate-900 p-3 rounded-xl mb-3 hidden">
    <div class="flex justify-between text-xs mb-1">
      <span id="renderStepText" class="text-indigo-300">ထုတ်လုပ်နေသည်...</span>
      <span id="renderPercentText">0%</span>
    </div>
    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
      <div id="renderBar" class="bg-indigo-500 h-full w-0"></div>
    </div>
  </div>
  <button type="button" id="startGenerateBtn" class="btn-gen text-xs mb-2">🚀 အသံပါသော ဗီဒီယို Generate လုပ်မည်</button>
  <a id="downloadReadyBtn" class="w-full bg-emerald-600 text-center py-3 rounded-xl text-xs font-bold opacity-40 pointer-events-none">📥 ဒေါင်းလုဒ်ဆွဲရန်</a>
</div>

<script>
const el = id => document.getElementById(id);
const videoUpload = el('videoUpload');
const hiddenVideo = el('hiddenVideo');
const studioCanvas = el('studioCanvas');
const ctx = studioCanvas.getContext('2d');
const recapScript = el('recapScript');
const statusLog = el('statusLog');
const geminiKey = el('geminiKey');

let uploadedFile = null;
let curRatio = '9:16';
let subText = "";
let isBusy = false;

if (localStorage.getItem('rk_key')) {
  geminiKey.value = localStorage.getItem('rk_key');
}
geminiKey.oninput = () => {
  localStorage.setItem('rk_key', geminiKey.value.trim());
};

function log(m) {
  statusLog.classList.remove('hidden');
  statusLog.textContent = m;
}

document.querySelectorAll('.ratio-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.ratio-btn').forEach(x => x.classList.remove('active-r'));
    b.classList.add('active-r');
    curRatio = b.dataset.ratio;
    if (curRatio === '9:16') { studioCanvas.width = 540; studioCanvas.height = 960; }
    if (curRatio === '16:9') { studioCanvas.width = 960; studioCanvas.height = 540; }
    if (curRatio === '1:1') { studioCanvas.width = 720; studioCanvas.height = 720; }
    if (curRatio === '4:5') { studioCanvas.width = 720; studioCanvas.height = 900; }
    drawFrame();
  };
});

videoUpload.onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  uploadedFile = f;
  el('uploadLabel').textContent = "✅ ရွေးချယ်ပြီး: " + f.name;
  hiddenVideo.src = URL.createObjectURL(f);
  hiddenVideo.onloadedmetadata = () => {
    const d = hiddenVideo.duration || 0;
    const m = Math.floor(d / 60).toString().padStart(2, '0');
    const s = Math.floor(d % 60).toString().padStart(2, '0');
    el('durationTag').textContent = m + ":" + s;
    hiddenVideo.currentTime = 0.1;
  };
};

hiddenVideo.onseeked = drawFrame;

function drawFrame() {
  const cw = studioCanvas.width, ch = studioCanvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  if (hiddenVideo.readyState >= 2 && hiddenVideo.videoWidth > 0) {
    const vw = hiddenVideo.videoWidth, vh = hiddenVideo.videoHeight;
    const sc = Math.min(cw / vw, ch / vh);
    const nw = vw * sc, nh = vh * sc;
    ctx.drawImage(hiddenVideo, (cw - nw) / 2, (ch - nh) / 2, nw, nh);
  }
  if (subText) {
    const fs = Math.round(cw * 0.042);
    ctx.font = "bold " + fs + "px sans-serif";
    ctx.textAlign = "center";
    const words = subText.split(' ');
    const lines = [];
    let cur = words[0] || '';
    for (let i = 1; i < words.length; i++) {
      const t = cur + " " + words[i];
      if (ctx.measureText(t).width < cw - 40) cur = t;
      else { lines.push(cur); cur = words[i]; }
    }
    lines.push(cur);
    const lh = fs * 1.4;
    const bh = lines.length * lh;
    const sy = ch - 90 - bh;
    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(16, sy - 10, cw - 32, bh + 20);
    lines.forEach((l, i) => {
      const y = sy + i * lh + lh / 2;
      ctx.fillStyle = "#fde047";
      ctx.fillText(l, cw / 2, y);
    });
  }
}

async function getTtsBuffer(actx, text) {
  const clean = text.split(/\n+/).map(l => l.replace(/^\[\d+:\d+\]\s*/, '').trim()).filter(Boolean).join(' ။ ');
  if (!clean) throw new Error("စာသားမရှိပါ");
  const chunks = [];
  for (let i = 0; i < clean.length; i += 120) {
    chunks.push(clean.slice(i, i + 120));
  }
  const bufs = [];
  for (let i = 0; i < chunks.length; i++) {
    log("🎙️ Google TTS အသံဆွဲယူနေသည် (" + (i + 1) + "/" + chunks.length + ")...");
    const q = encodeURIComponent(chunks[i]);
    const gUrl = "https://translate.google.com/translate_tts?ie=UTF-8&q=" + q + "&tl=my&client=tw-ob";
    const pUrl = "https://corsproxy.io/?" + encodeURIComponent(gUrl);
    const r = await fetch(pUrl);
    const ab = await r.arrayBuffer();
    const dec = await actx.decodeAudioData(ab);
    bufs.push(dec);
  }
  const len = bufs.reduce((a, b) => a + b.length, 0);
  const out = actx.createBuffer(1, len, bufs[0].sampleRate);
  const ch = out.getChannelData(0);
  let off = 0;
  for (const b of bufs) {
    ch.set(b.getChannelData(0), off);
    off += b.length;
  }
  return out;
}

el('previewVoiceBtn').onclick = async () => {
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const txt = recapScript.value.trim() || "မင်္ဂလာပါ ဂူဂဲလ် မြန်မာ အသံစနစ် ဖြစ်ပါသည်။";
    const buf = await getTtsBuffer(actx, txt);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const g = document.querySelector('input[name="aiVoice"]:checked').value;
    if (g === 'MALE') src.detune.value = -250;
    src.connect(actx.destination);
    src.start(0);
    log("🔊 အသံဖွင့်နေပါသည်...");
  } catch (e) {
    alert("အသံအမှား: " + e.message);
  }
};

el('aiAnalyzeBtn').onclick = async () => {
  if (!uploadedFile) return alert("ဗီဒီယို အရင်တင်ပါ");
  const key = geminiKey.value.trim();
  if (!key) return alert("API Key ထည့်ပါ");
  el('aiAnalyzeBtn').disabled = true;
  try {
    log("📸 ဗီဒီယိုပုံရိပ်များ ဖမ်းယူနေသည်...");
    const parts = [{ text: "Write Burmese movie recap script with timestamps like [00:00], [00:03] for these frames. Only output Burmese lines:" }];
    const oc = document.createElement('canvas');
    oc.width = 360; oc.height = 202;
    const octx = oc.getContext('2d');
    const dur = Math.max(1, hiddenVideo.duration || 10);
    for (let i = 0; i < 4; i++) {
      hiddenVideo.currentTime = (dur / 4) * i + 0.2;
      await new Promise(r => setTimeout(r, 600));
      octx.drawImage(hiddenVideo, 0, 0, 360, 202);
      const b64 = oc.toDataURL('image/jpeg', 0.6).split(',')[1];
      parts.push({ inline_data: { mime_type: "image/jpeg", data: b64 } });
    }
    hiddenVideo.currentTime = 0.1;

    const mRes = await fetch("https://generativelanguage.googleapis.com/v1beta/models?key=" + key);
    const mData = await mRes.json();
    let models = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];
    if (mData.models) {
      const found = mData.models.map(m => m.name.replace('models/', '')).filter(n => n.includes('flash') && !n.includes('tts') && !n.includes('1.5') && !n.includes('2.0'));
      if (found.length) models = found;
    }

    let okText = "";
    let lastE = "";
    for (const m of models) {
      log("⏳ " + m + " ဖြင့် စစ်ဆေးနေသည်...");
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + m + ":generateContent?key=" + key, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }] })
      });
      const d = await res.json();
      if (d.candidates?.[0]?.content?.parts?.[0]?.text) {
        okText = d.candidates[0].content.parts[0].text.trim();
        break;
      }
      lastE = d.error?.message || "Error";
    }
    if (!okText) throw new Error(lastE);
    recapScript.value = okText;
    log("✅ ဇာတ်လမ်းရရှိပါပြီ! အောက်က Generate ခလုတ်ကို နှိပ်ပါ။");
  } catch (e) {
    log("❌ " + e.message);
    alert(e.message);
  } finally {
    el('aiAnalyzeBtn').disabled = false;
  }
};

el('startGenerateBtn').onclick = async () => {
  if (!uploadedFile || !recapScript.value.trim()) return alert("ဗီဒီယိုနှင့် စာသား လိုအပ်ပါသည်");
  if (isBusy) return;
  isBusy = true;
  el('renderProgressBox').classList.remove('hidden');
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') await actx.resume();
    const abuf = await getTtsBuffer(actx, recapScript.value);
    const dest = actx.createMediaStreamDestination();
    const src = actx.createBufferSource();
    src.buffer = abuf;
    const g = document.querySelector('input[name="aiVoice"]:checked').value;
    if (g === 'MALE') src.detune.value = -250;
    const dur = hiddenVideo.duration || 10;
    if (abuf.duration > dur) src.playbackRate.value = Math.min(1.4, abuf.duration / dur);
    src.connect(dest);
    src.connect(actx.destination);

    const lines = recapScript.value.split(/\n+/).filter(Boolean);
    const tl = lines.map((l, i) => {
      const m = l.match(/^\[(\d+):(\d+)\]\s*(.*)/);
      return m ? { t: parseInt(m[1]) * 60 + parseInt(m[2]), txt: m[3] } : { t: (dur / lines.length) * i, txt: l };
    });

    hiddenVideo.currentTime = 0;
    const cStream = studioCanvas.captureStream(30);
    const mix = new MediaStream([...cStream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const chunks = [];
    const rec = new MediaRecorder(mix, { mimeType: 'video/webm' });
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const dl = el('downloadReadyBtn');
      dl.href = URL.createObjectURL(blob);
      dl.download = "RECAP_" + Date.now() + ".webm";
      dl.classList.remove('opacity-40', 'pointer-events-none');
      log("🎉 ဗီဒီယိုနှင့်အသံ ထုတ်လုပ်ပြီးပါပြီ! ဒေါင်းလုဒ်ဆွဲနိုင်ပါပြီ။");
      isBusy = false;
    };

    await hiddenVideo.play();
    rec.start();
    src.start(0);

    function loop() {
      if (!isBusy) return;
      const ct = hiddenVideo.currentTime;
      const p = Math.min(100, Math.round((ct / dur) * 100));
      el('renderBar').style.width = p + "%";
      el('renderPercentText').textContent = p + "%";
      for (let i = 0; i < tl.length; i++) {
        if (ct >= tl[i].t) subText = tl[i].txt;
      }
      drawFrame();
      if (!hiddenVideo.paused && !hiddenVideo.ended) requestAnimationFrame(loop);
      else {
        try { src.stop(); } catch(e){}
        rec.stop();
      }
    }
    requestAnimationFrame(loop);
  } catch (e) {
    alert("Error: " + e.message);
    isBusy = false;
  }
};
</script>
</body>
</html>
