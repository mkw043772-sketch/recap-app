<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Drama AI Script Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body {
            font-family: 'Padauk', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 pb-4 border-b border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-amber-400 flex items-center gap-3">
                    <i class="fa-solid fa-clapperboard"></i> C-Drama AI Script Studio
                </h1>
                <p class="text-slate-400 text-sm mt-1">တရုတ်ဇာတ်လမ်းများမှ အချိန်အတိအကျ၊ အမူအရာ၊ မြင်ကွင်းနှင့် စကားပြောများကို မြန်မာဘာသာဖြင့် Script ထုတ်ပေးသည့်စနစ်</p>
            </div>
            <div class="w-full md:w-72">
                <label class="text-xs text-slate-400 block mb-1">Gemini API Key ထည့်ရန်</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-sm focus:outline-none focus:border-amber-400">
            </div>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Column: Video Upload & Settings (5 Cols) -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Upload Box -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <h2 class="text-lg font-bold mb-3 text-amber-300"><i class="fa-solid fa-upload mr-2"></i>၁။ ဗီဒီယိုဖိုင် တင်ရန်</h2>
                    
                    <label for="videoInput" class="flex flex-col items-center justify-center w-full h-44 border-2 border-dashed border-slate-600 rounded-lg cursor-pointer bg-slate-900/50 hover:bg-slate-900 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-amber-400 mb-3"></i>
                            <p class="mb-1 text-sm text-slate-300"><span class="font-semibold">ဗီဒီယိုရွေးရန် နှိပ်ပါ</span> သို့မဟုတ် ဆွဲထည့်ပါ</p>
                            <p class="text-xs text-slate-500">MP4, MOV, WebM (Browser မှ တိုက်ရိုက်တင်လျှင် 20MB အောက် အသင့်တော်ဆုံးဖြစ်သည်)</p>
                        </div>
                        <input id="videoInput" type="file" accept="video/*" class="hidden" />
                    </label>

                    <!-- Video Preview -->
                    <div id="videoPreviewContainer" class="mt-4 hidden">
                        <video id="videoPreview" controls class="w-full rounded-lg border border-slate-700 max-h-60 bg-black"></video>
                        <p id="fileInfo" class="text-xs text-slate-400 mt-2 truncate"></p>
                    </div>
                </div>

                <!-- Script Style Options -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
                    <h2 class="text-lg font-bold text-amber-300"><i class="fa-solid fa-sliders mr-2"></i>၂။ Script ပုံစံ ရွေးချယ်ရန်</h2>
                    
                    <div>
                        <label class="text-sm text-slate-300 block mb-1">ဘာသာပြန်မည့် အရေးအသားပုံစံ</label>
                        <select id="scriptStyle" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                            <option value="detailed">အသေးစိတ် (အချိန် + မြင်ကွင်း/အမူအရာ + ပြောစကား + Recap Narration)</option>
                            <option value="recap">Movie Recap သီးသန့် (အချိန် + မြင်ကွင်းနှင့် ဇာတ်ကြောင်းပြောစာသား)</option>
                            <option value="dialogue">ဇာတ်ညွှန်းပုံစံ (အချိန် + အမူအရာ + သဘာဝကျသော ဒိုင်ယာလော့ခ်)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-sm text-slate-300 block mb-1">ဇာတ်လမ်းအမျိုးအစား (အသုံးအနှုန်း မှန်ကန်စေရန်)</label>
                        <select id="dramaGenre" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                            <option value="modern">ခေတ်ပေါ် တရုတ်ဇာတ်လမ်း (CEO, အချစ်, မိသားစု, လက်စားချေ)</option>
                            <option value="wuxia">ရှေးဟောင်း နန်းတွင်း / သိုင်း / ရှန်ရှား (Wuxia / Xianxia)</option>
                            <option value="suspense">မှုခင်း / လျှို့ဝှက်သည်းဖို (Suspense / Thriller)</option>
                        </select>
                    </div>

                    <button id="generateBtn" onclick="generateScript()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg transition flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> မြန်မာ Script စတင်ထုတ်မည်
                    </button>

                    <!-- Status Bar -->
                    <div id="statusBox" class="hidden p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm flex items-center gap-3">
                        <i id="statusIcon" class="fa-solid fa-spinner fa-spin text-amber-400"></i>
                        <span id="statusText" class="text-slate-300">ဗီဒီယိုကို စစ်ဆေးနေပါသည်...</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: Script Output, Copy & Download (7 Cols) -->
            <div class="lg:col-span-7 flex flex-col bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                
                <!-- Action Bar -->
                <div class="p-4 bg-slate-900/80 border-b border-slate-700 flex flex-wrap justify-between items-center gap-3">
                    <h2 class="text-lg font-bold text-amber-300 flex items-center gap-2">
                        <i class="fa-solid fa-file-lines"></i> ထွက်ရှိလာသော မြန်မာ Script
                    </h2>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="copyScript()" id="copyBtn" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm transition flex items-center gap-1.5">
                            <i class="fa-regular fa-copy"></i> ကော်ပီကူးမည်
                        </button>
                        <button onclick="downloadScript('txt')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm transition flex items-center gap-1.5">
                            <i class="fa-solid fa-download"></i> TXT ဒေါင်းမည်
                        </button>
                        <button onclick="downloadScript('md')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm transition flex items-center gap-1.5">
                            <i class="fa-solid fa-file-code"></i> MD ဒေါင်းမည်
                        </button>
                    </div>
                </div>

                <!-- Editable Script Area -->
                <div class="p-4 flex-grow flex flex-col">
                    <textarea id="scriptOutput" rows="20" placeholder="ဗီဒီယိုတင်ပြီး 'မြန်မာ Script စတင်ထုတ်မည်' ကိုနှိပ်ပါ။ အချိန်အတိအကျ၊ ဇာတ်ကောင်အမူအရာ၊ မြင်ကွင်းနှင့် ပြောစကားများ ဒီနေရာတွင် ပေါ်လာပါမည်..." class="w-full flex-grow bg-slate-900 border border-slate-700 rounded-lg p-4 text-slate-100 leading-relaxed focus:outline-none focus:border-amber-400 custom-scrollbar resize-none"></textarea>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg hidden transition-opacity duration-300"></div>

    <script>
        let selectedVideoFile = null;
